# Hush Satisfy Lab: cada noche GitHub hace los 2 Satisfy del día (mismo código que el PC de Pol) y los deja en una
# «release» satisfy-AAAA-MM-DD. El PC de Pol los descarga solo al hacer el lote de la madrugada y salen en el panel.
name: Satisfy

on:
  schedule:
    - cron: "17 0 * * *"        # 00:17 UTC = 01:17 en España (invierno) / 02:17 (verano)
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy en Madrid)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: satisfy
  cancel-in-progress: false

jobs:
  satisfy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: motor3d/package-lock.json

      - name: Instalar ffmpeg y librerías de Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          pip install -q -r requirements.txt

      - name: Remotion
        working-directory: motor3d
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Los 2 Satisfy del día
        env:
          PARTICULAS_GL: swangle
        run: |
          if [ -n "${{ inputs.fecha }}" ]; then python ci/satisfy.py --fecha "${{ inputs.fecha }}"; else python ci/satisfy.py; fi

      - name: Publicar la release del día
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(ls salida/*.mp4 | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          gh release delete "satisfy-$F" --yes --cleanup-tag 2>/dev/null || true
          gh release create "satisfy-$F" salida/* --title "Satisfy $F" --notes "Vídeos sin voz del $F (Satisfy + interactivo de Skin)"
          # las de hace más de 10 días sobran (el PC ya los tiene)
          LIM=$(date -u -d "10 days ago" +%F)
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read t; do
            d=${t#satisfy-}; if [[ "$d" < "$LIM" ]]; then gh release delete "$t" --yes --cleanup-tag || true; fi
          done

      - name: Guardar el registro (para no repetir nada)
        if: always()
        run: |
          git config user.name "hush-render"
          git config user.email "actions@users.noreply.github.com"
          git add stories/particulas-usadas.json stories/interactivos-usados.json
          git diff --cached --quiet || git commit -m "Registro Satisfy $(date -u +%F)"
          git push || true
